<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Aluat</title>
    <style>
        :root {
            --primary: #d4a373; /* warm tone */
            --secondary: #faedcd; /* light background */
            --text: #3e2723; /* dark brown */
            --bg: #fefae0; /* cream */
            --btn-hover: #ccd5ae; /* olive green highlight */
            --error: #e63946;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .container {
            background-color: var(--secondary);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .menu-view, .calc-view {
            display: none;
        }

        .active {
            display: block;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: background-color 0.3s;
            box-sizing: border-box;
        }

        button:hover {
            background-color: var(--btn-hover);
            color: var(--text);
        }

        .btn-back {
            background-color: #ccc;
            color: var(--text);
            margin-top: 20px;
        }

        .btn-back:hover {
            background-color: #bbb;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #fff;
            border-left: 4px solid var(--primary);
            font-weight: bold;
            display: none;
        }
        
        .error {
            color: var(--error);
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <header>Created by Cornel</header>

    <div class="container">
        <!-- Main Menu -->
        <div id="main-menu" class="menu-view active">
            <h1>Alege tipul</h1>
            <button onclick="showView('biga-view')">Calcul Biga</button>
            <button onclick="showView('aluat-view')">Calcul Aluat</button>
        </div>

        <!-- Biga Calculator -->
        <div id="biga-view" class="calc-view">
            <h1>Calcul Biga</h1>
            <div class="input-group">
                <label for="b-aer">Temperatură aer (°C):</label>
                <input type="number" id="b-aer" step="0.1" placeholder="ex. 24.5">
            </div>
            <div class="input-group">
                <label for="b-faina">Temperatură făină (°C):</label>
                <input type="number" id="b-faina" step="0.1" placeholder="ex. 20">
            </div>
            <div id="b-error" class="error">Introduceți toate valorile numerice corect.</div>
            <button onclick="calcBiga()">Calculează</button>
            <div id="b-result" class="result-box"></div>
            <button class="btn-back" onclick="showView('main-menu')">Înapoi</button>
        </div>

        <!-- Aluat Calculator -->
        <div id="aluat-view" class="calc-view">
            <h1>Calcul Aluat</h1>
            <div class="input-group">
                <label for="a-biga">Temperatură biga (°C):</label>
                <input type="number" id="a-biga" step="0.1" placeholder="ex. 18">
            </div>
            <div class="input-group">
                <label for="a-faina">Temperatură făină (°C):</label>
                <input type="number" id="a-faina" step="0.1" placeholder="ex. 20">
            </div>
            <div class="input-group">
                <label for="a-aer">Temperatură aer (°C):</label>
                <input type="number" id="a-aer" step="0.1" placeholder="ex. 24.5">
            </div>
            <div id="a-error" class="error">Introduceți toate valorile numerice corect.</div>
            <button onclick="calcAluat()">Calculează</button>
            <div id="a-result" class="result-box"></div>
            <button class="btn-back" onclick="showView('main-menu')">Înapoi</button>
        </div>
    </div>

    <script>
        function showView(viewId) {
            // Hide all views
            document.querySelectorAll('.menu-view, .calc-view').forEach(v => {
                v.classList.remove('active');
            });
            // Show requested view
            document.getElementById(viewId).classList.add('active');
            
            // Clear inputs and results
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.querySelectorAll('.result-box').forEach(r => {
                r.style.display = 'none';
                r.innerHTML = '';
            });
            document.querySelectorAll('.error').forEach(e => e.style.display = 'none');
        }

        function validateNumber(val) {
            return !isNaN(val) && val !== '';
        }

        function calcBiga() {
            const aer = document.getElementById('b-aer').value;
            const faina = document.getElementById('b-faina').value;
            const errorElement = document.getElementById('b-error');
            const resultElement = document.getElementById('b-result');

            if (!validateNumber(aer) || !validateNumber(faina)) {
                errorElement.style.display = 'block';
                resultElement.style.display = 'none';
                return;
            }

            errorElement.style.display = 'none';
            
            const numAer = parseFloat(aer);
            const numFaina = parseFloat(faina);

            const rezultat = numAer + numFaina;
            const tempApa = 54 - rezultat;

            resultElement.innerHTML = \`Temperatura apei trebuie să fie: <span>\${tempApa.toFixed(1)}°C</span>\`;
            resultElement.style.display = 'block';
        }

        function calcAluat() {
            const biga = document.getElementById('a-biga').value;
            const faina = document.getElementById('a-faina').value;
            const aer = document.getElementById('a-aer').value;
            const errorElement = document.getElementById('a-error');
            const resultElement = document.getElementById('a-result');

            if (!validateNumber(biga) || !validateNumber(faina) || !validateNumber(aer)) {
                errorElement.style.display = 'block';
                resultElement.style.display = 'none';
                return;
            }

            errorElement.style.display = 'none';

            const numBiga = parseFloat(biga);
            const numFaina = parseFloat(faina);
            const numAer = parseFloat(aer);

            const r = (numBiga + numFaina) / 2;
            const x = r + numAer;
            const tempApa = 54 - x;

            resultElement.innerHTML = \`Temperatura apei trebuie să fie: <span>\${tempApa.toFixed(1)}°C</span>\`;
            resultElement.style.display = 'block';
        }
    </script>
</body>
</html>
